[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lira-ai-backend"
version = "0.1.0"
description = "LIRA-AI: Predictive Intelligence for Investable Landscape Regeneration"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "httpx>=0.28.1",

    # Production hardening (Phase 1+ refactor)
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.1",
    "fastmcp>=2.0.0",

    # Geospatial core
    "geopandas>=1.0.1",
    "rasterio>=1.4.3",
    "rioxarray>=0.18.1",
    "xarray>=2024.11.0",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "fiona>=1.10.1",

    # Planetary Computer / STAC
    "planetary-computer>=1.0.0",
    "pystac-client>=0.8.3",
    "pystac>=1.11.0",
    "stackstac>=0.5.1",
    "odc-stac>=0.3.9",

    # Climate / raster processing
    "cftime>=1.6.4",
    "netCDF4>=1.7.2",
    "dask>=2024.11.0",
    "zarr>=2.18.3",

    # Data science
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "networkx>=3.4.2",

    # RAG / embeddings
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",

    # Config / utilities
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.5",

    # Export
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]
